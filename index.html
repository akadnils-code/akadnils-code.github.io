.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.chip{flex:0 0 auto;border:1px solid rgba(212,175,55,.35);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.chip.on{background:linear-gradient(135deg,#f6dc85,#d4af37);color:#0a0a0a;border-color:transparent}

.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.g4 .kpi{padding:8px 4px;text-align:center}.g4 .kpi span{font-size:10px}.g4 .kpi b{font-size:18px}

/* ===== Thème premium blanc : navy, or et bleu doux, menu horizontal ===== */
body.wtrk{--bg:#fff;--card:#fff;--tx:#1b2438;--mut:#667085;--br:#e8ebf2;--ac:#14213d;--acx:#fff;--ok:#15803d;--okbg:#e3f6ea;--ko:#b42318;--kobg:#fdeaea;--wa:#8a6a12;--wabg:#fff4d6;padding:0 12px 28px;background:linear-gradient(180deg,#fff 0%,#f4f7fc 100%) fixed!important;color:#1b2438;font-family:-apple-system,"SF Pro Text","Segoe UI",system-ui,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}

body.wtrk{--pl:max(12px,env(safe-area-inset-left,0px));--pr:max(12px,env(safe-area-inset-right,0px));padding-left:var(--pl);padding-right:var(--pr);overflow-x:hidden}

function cfmt(n){return isFinite(n)?String(parseFloat(n.toPrecision(10))):'Erreur'}

function cpress(k){
  if(C.d==='Erreur'&&k!=='AC')return;
  if(/^\d$/.test(k)){if(C.fresh){C.d=k;C.fresh=false}else if(C.d.replace(/\D/g,'').length<12)C.d=(C.d==='0'?k:(C.d==='-0'?'-'+k:C.d+k))}
  else if(k==='.'){if(C.fresh){C.d='0.';C.fresh=false}else if(C.d.indexOf('.')<0)C.d+='.'}
  else if(k==='AC'){C={d:'0',a:null,op:null,fresh:true}}
  else if(k==='±'){C.d=C.d[0]==='-'?C.d.slice(1):(C.d==='0'?'0':'-'+C.d)}
  else if(k==='%'){C.d=cfmt(parseFloat(C.d)/100);C.fresh=true}
  else if(k==='='){if(C.op!==null){C.d=cfmt(ccalc(C.a,parseFloat(C.d),C.op));C.op=null;C.a=null;C.fresh=true}}
  else{if(C.op!==null&&!C.fresh){C.a=ccalc(C.a,parseFloat(C.d),C.op);C.d=cfmt(C.a)}else C.a=parseFloat(C.d);C.op=k;C.fresh=true}
}

  else if(a==='vphdel'){var vq=vget(S.vsel);if(vq)vq.photo='';}
  else if(a==='adel'){var vr=vget(S.vsel);if(vr){if(S.del===id){vr.arts=vr.arts.filter(function(x){return x.id!==id});S.del='';}else{S.del=id;}}}
  else if(a==='vart'){var vx2=vget(S.vsel),nm=g('a-n').value.trim();if(!vx2){}else if(!nm){S.msg='Il faut le nom de l’article.';}else{var fl=g('a-f').files[0],art={id:uid(),name:nm,price:parseFloat(g('a-p').value)||0,desc:g('a-d').value.trim(),img:''};vx2.arts=vx2.arts||[];if(fl){readPhoto(fl,640,function(d){art.img=d;vx2.arts.push(art);S.msg='Article ajouté.';save();render()});return;}vx2.arts.push(art);S.msg='Article ajouté.';}}

document.addEventListener('change',function(e){
  var t=e.target,id=t.getAttribute('data-id'),o=id?byId(id):null;
  if(t.id==='vf'){S.vendor=t.value;render();return;}
  if(t.id==='wf'){S.wf=t.value;render();return;}
  if(t.id==='wq'){S.wq=t.value;render();return;}
  if(t.id==='tf'){S.tf=t.value;render();return;}
  if(t.id==='cq'){S.cq=t.value;render();return;}
  if(t.type==='file'){if(t.getAttribute('data-photo')==='profile'){var vp2=vget(S.vsel);if(vp2&&t.files[0])readPhoto(t.files[0],320,function(d){if(d){vp2.photo=d;save();render()}});}return;}
  if(t.getAttribute('data-vf')){var xv=vget(S.vsel);if(xv){var fk=t.getAttribute('data-vf');if(fk==='name'){var nn=t.value.trim();if(nn&&nn!==xv.name){S.orders.forEach(function(o){if(o.vendor===xv.name)o.vendor=nn});xv.name=nn}}else xv[fk]=t.value.trim();}save();render();return;}
  if(t.getAttribute('data-wst')){var wx=S.set.wallet.filter(function(x){return x.id===id})[0];if(wx)wx.st=t.value;save();render();return;}
  if(t.getAttribute('data-sim')){S.set.sim[t.getAttribute('data-sim')]=parseFloat(t.value)||0;save();render();return;}
  if(t.getAttribute('data-ch')&&o){o[t.getAttribute('data-ch')]=t.value;}
  else if(t.getAttribute('data-set')){var k=t.getAttribute('data-set');S.set[k]=k==='tpl'?(t.value||DEF_TPL):(k==='insta'||k==='phone'||k==='basis'||k==='rib'||k==='holder'||k==='db'||k==='tiles'||k==='ckey')?t.value.trim():(parseFloat(t.value)||0);}
  else if(t.getAttribute('data-before')&&S.vendor){S.set.before[S.vendor]=t.value===''?null:parseFloat(t.value);}
  else if(t.getAttribute('data-dst')){var dd=S.set.deals.filter(function(x){return x.id===id})[0];if(dd)dd.status=t.value;}
  else return;
  save();render();
});
